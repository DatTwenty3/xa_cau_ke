<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bản Đồ Tương Tác Xã Cầu Kè | Trà Vinh</title>
  
  <!-- Meta SEO -->
  <meta name="description" content="Bản đồ tương tác hiển thị thông tin ranh giới, diện tích, dân số, mật độ và ban lãnh đạo của xã Cầu Kè, huyện Cầu Kè, tỉnh Trà Vinh trên nền bản đồ Google Maps có nhãn cực sắc nét.">
  <meta name="keywords" content="Bản đồ Cầu Kè, Xã Cầu Kè, Huyện Cầu Kè, Trà Vinh, Bản đồ tương tác, Bản đồ vệ tinh Google">
  <meta name="author" content="Antigravity GIS">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Custom Styling -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Leaflet JS (loaded in head for faster layout initialization) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>

  <!-- Floating Sidebar Toggle Button -->
  <button id="sidebar-toggle" class="sidebar-toggle-btn" title="Mở danh mục thông tin">
    <i class="fas fa-bars"></i>
  </button>

  <!-- Sidebar Backdrop for Mobile focus and dimming -->
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <!-- Left Sidebar Panel (Glassmorphism Styled) -->
  <aside id="sidebar">
    <div class="bottom-sheet-handle"></div>
    <div class="sidebar-header">
      <button id="close-sidebar" class="close-sidebar-btn" title="Đóng bảng thông tin">
        <i class="fas fa-times"></i>
      </button>
      <div class="brand-wrapper">
        <div class="brand-icon">
          <i class="fas fa-map-location-dot"></i>
        </div>
        <div class="brand-text">
          <h2>Hệ Thống GIS</h2>
          <p>Bản đồ Hành chính</p>
        </div>
      </div>
      <span id="commune-level-badge" class="commune-badge">
        <i class="fas fa-shield-halved"></i> <span id="commune-badge-text">Đơn vị cấp Xã</span>
      </span>
    </div>
    
    <div class="sidebar-content">
      <!-- Identity card -->
      <div class="info-title-group">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 4px;">
          <h1 id="commune-name" style="margin: 0;">Chọn một ấp</h1>
          <button id="tts-btn" class="tts-speech-btn" title="Nghe giới thiệu bằng giọng nói" style="display: none;">
            <i class="fas fa-volume-up"></i>
          </button>
        </div>
      </div>
      
      <!-- Metrics Stat Grid -->
      <div class="stat-grid">
        <div class="stat-card" title="Tổng diện tích tự nhiên của xã">
          <div class="stat-icon-wrapper">
            <i class="fas fa-vector-square"></i>
          </div>
          <div id="stat-area" class="stat-value">54,12 km²</div>
          <div id="stat-area-label" class="stat-label">Diện tích</div>
        </div>
        
        <div class="stat-card" title="Tổng quy mô dân số">
          <div class="stat-icon-wrapper">
            <i class="fas fa-users"></i>
          </div>
          <div id="stat-pop" class="stat-value">35.491</div>
          <div id="stat-pop-label" class="stat-label">Dân số</div>
        </div>
        
        <div class="stat-card" title="Tổng số hộ gia đình toàn xã">
          <div id="stat-density-icon" class="stat-icon-wrapper">
            <i class="fas fa-house-chimney"></i>
          </div>
          <div id="stat-density" class="stat-value">8.399</div>
          <div id="stat-density-label" class="stat-label">Số hộ</div>
        </div>
      </div>

      <!-- Administrative Table Section -->
      <div class="info-section">
        <h3 class="section-title"><i class="fas fa-circle-info"></i> Chỉ số hành chính</h3>
        <div class="info-table">
          <div class="info-row">
            <span class="info-label"><i class="fas fa-landmark"></i> Phân loại đơn vị:</span>
            <span id="info-type" class="info-value">Xã</span>
          </div>
          <div class="info-row">
            <span class="info-label"><i class="fas fa-layer-group"></i> Cấp quản lý:</span>
            <span id="info-level" class="info-value">Cấp 2</span>
          </div>
          <div class="info-row">
            <span class="info-label"><i class="fas fa-chart-area"></i> Mật độ dân số:</span>
            <span id="info-density" class="info-value">— người/km²</span>
          </div>
          <div class="info-row" style="flex-direction: column; gap: 6px; align-items: stretch; border: none; padding-bottom: 0;">
            <span id="merger-title" class="info-label" style="font-weight: 700; color: var(--text-primary);"><i class="fas fa-compress-arrows-alt"></i> Khu vực giáp ranh / sáp nhập:</span>
            <div id="info-merger" class="merger-tags-container"></div>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Floating Custom Map Layer Controller -->
  <div class="map-layer-control">
    <button class="layer-btn active" data-layer="hybrid" title="Ảnh vệ tinh kết hợp nhãn đường đi">
      <i class="fas fa-earth-asia"></i> <span>Google Vệ Tinh</span>
    </button>
    <button class="layer-btn" data-layer="roadmap" title="Bản đồ đường đi Google Maps tiêu chuẩn">
      <i class="fas fa-road"></i> <span>Google Bản Đồ</span>
    </button>
    <button class="layer-btn" data-layer="terrain" title="Bản đồ địa hình Google">
      <i class="fas fa-mountain-sun"></i> <span>Google Địa Hình</span>
    </button>
  </div>

  <!-- Interactive Pulse Hint Overlay on map center -->
  <div id="map-hint" class="map-hint-overlay">
    <i class="fas fa-hand-pointer"></i>
    <span>Nhấp chuột vào một ấp để xem thông tin chi tiết</span>
  </div>

  <!-- Map element takes full screen behind panels -->
  <main id="map"></main>

  <!-- Core Scripts (Controller logic) -->
  <script src="js/app.js"></script>
</body>
</html>
